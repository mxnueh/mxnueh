  <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/><stop offset=".5" stop-color="#2dd4bf" stop-opacity=".9"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></linearGradient>
  <clipPath id="card"><rect width="480" height="184" rx="14"/></clipPath>
