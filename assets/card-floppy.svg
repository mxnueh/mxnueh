<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 184" width="480" height="184" role="img" aria-label="Proyecto floppy: Monitoreo del nivel de agua para prevenir inundaciones, con gráficas y alertas por correo.">
<defs>
