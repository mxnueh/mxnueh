<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 184" width="480" height="184" role="img" aria-label="Proyecto Raspberry-Pi: Robot controlado con mando PS4, LiDAR, servos y cámara, con panel web en tiempo real.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d1c"/><stop offset="1" stop-color="#111a3a"/></linearGradient>
  <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E8416E" stop-opacity="0"/><stop offset=".5" stop-color="#E8416E" stop-opacity=".9"/><stop offset="1" stop-color="#E8416E" stop-opacity="0"/></linearGradient>
  <clipPath id="card"><rect width="480" height="184" rx="14"/></clipPath>
