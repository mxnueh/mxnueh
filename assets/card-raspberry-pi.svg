  <text x="28" y="124" font-family="'Segoe UI','Inter',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#94a3b8">y cámara, con panel web en tiempo real.</text>
  <rect x="28" y="140" width="66" height="26" rx="13" fill="#E8416E" fill-opacity=".12" stroke="#E8416E" stroke-opacity=".4"/><text x="39" y="157" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#E8416E" textLength="44" lengthAdjust="spacingAndGlyphs">Python</text><rect x="102.4" y="140" width="126" height="26" rx="13" fill="#E8416E" fill-opacity=".12" stroke="#E8416E" stroke-opacity=".4"/><text x="113.4" y="157" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#E8416E" textLength="104" lengthAdjust="spacingAndGlyphs">Flask-SocketIO</text><rect x="236.00000000000003" y="140" width="52" height="26" rx="13" fill="#E8416E" fill-opacity=".12" stroke="#E8416E" stroke-opacity=".4"/><text x="247.00000000000003" y="157" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#E8416E" textLength="30" lengthAdjust="spacingAndGlyphs">GPIO</text>
