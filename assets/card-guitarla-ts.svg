  <text x="28" y="104" font-family="'Segoe UI','Inter',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#94a3b8">Tienda de guitarras con carrito de compras</text>
  <text x="28" y="124" font-family="'Segoe UI','Inter',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#94a3b8">persistente en localStorage.</text>
  <rect x="28" y="140" width="59" height="26" rx="13" fill="#f59e0b" fill-opacity=".12" stroke="#f59e0b" stroke-opacity=".4"/><text x="39" y="157" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#f59e0b" textLength="37" lengthAdjust="spacingAndGlyphs">React</text><rect x="95.0" y="140" width="96" height="26" rx="13" fill="#f59e0b" fill-opacity=".12" stroke="#f59e0b" stroke-opacity=".4"/><text x="106.0" y="157" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#f59e0b" textLength="74" lengthAdjust="spacingAndGlyphs">TypeScript</text><rect x="199.0" y="140" width="52" height="26" rx="13" fill="#f59e0b" fill-opacity=".12" stroke="#f59e0b" stroke-opacity=".4"/><text x="210.0" y="157" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#f59e0b" textLength="30" lengthAdjust="spacingAndGlyphs">Vite</text>
